services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: getitdone
      POSTGRES_PASSWORD: getitdone
      POSTGRES_DB: getitdone
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getitdone -d getitdone"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
